# Siteyi derleyip cPanel'deki public_html'e FTP ile yükler.
# main'e her birleştirmede ve her gece 00:05'te (anasayfadaki "bugün" yenilensin diye) çalışır.
name: Yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 21 * * *' # 00:05 İstanbul
  workflow_dispatch:

concurrency:
  group: yayinla
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: FTP ile cPanel'e yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIZIN || './' }}
          # Sadece değişen dosyaları yükler; sunucudaki durum dosyası bu yüzden gerekli
          state-name: .ftp-deploy-sync-state.json
