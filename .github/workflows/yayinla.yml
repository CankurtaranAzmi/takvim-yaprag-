# Siteyi derleyip cPanel'deki public_html'e FTP ile yükler.
# main'e her birleştirmede ve her gece 00:05'te (anasayfadaki "bugün" yenilensin diye) çalışır.
name: Yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 21 * * *' # 00:05 İstanbul
  workflow_dispatch:

concurrency:
  group: yayinla
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: FTP ile cPanel'e yükle
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIZIN: ${{ vars.FTP_DIZIN || 'public_html' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Paylaşımlı hostingde bağlantı ara sıra kopabiliyor (geceleyin "max-retries exceeded" görüldü).
          # lftp kendi içinde 10 kez yeniden bağlanır; yine de olmazsa tüm yüklemeyi 3 kez baştan dener.
          # --only-newer sayesinde yeniden deneme sadece kalan dosyaları yükler.
          for deneme in 1 2 3; do
            if lftp -c "
              set ssl:verify-certificate no;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ftp:ssl-protect-list true;
              set net:max-retries 10;
              set net:timeout 30;
              set net:reconnect-interval-base 10;
              set net:reconnect-interval-max 60;
              open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
              mirror --reverse --verbose --only-newer --parallel=1 ./dist/ \"$FTP_DIZIN\";
            "; then
              echo "Yükleme tamam (deneme $deneme)"; exit 0
            fi
            echo "Deneme $deneme başarısız, 30 sn sonra tekrar..."; sleep 30
          done
          echo "Üç denemede de yüklenemedi"; exit 1
