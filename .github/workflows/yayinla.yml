# Siteyi derleyip cPanel'deki public_html'e FTP ile yükler.
# main'e her birleştirmede ve her gece 00:05'te (anasayfadaki "bugün" yenilensin diye) çalışır.
name: Yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 21 * * *' # 00:05 İstanbul
  workflow_dispatch:

concurrency:
  group: yayinla
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: FTP ile cPanel'e yükle (yalnızca değişenler)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIZIN: ${{ vars.FTP_DIZIN || 'public_html' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Önceki yayının parmak iziyle karşılaştırıp sadece değişen dosyaları yükler (tam yükleme ~25 dk sürüyordu).
          # Paylaşımlı hostingde bağlantı ara sıra koptuğu için yüklemeyi 3 kez dener; komutlar tekrar çalıştırılabilir.
          node scripts/yayin-fark.mjs /tmp/yukle.lftp "$FTP_DIZIN"
          {
            echo "set ssl:verify-certificate no"
            echo "set ftp:ssl-force true"
            echo "set ftp:ssl-protect-data true"
            echo "set ftp:ssl-protect-list true"
            echo "set net:max-retries 10"
            echo "set net:timeout 30"
            echo "set net:reconnect-interval-base 10"
            echo "set net:reconnect-interval-max 60"
            echo "set cmd:fail-exit yes"
            echo "open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\""
            cat /tmp/yukle.lftp
          } > /tmp/tam.lftp
          for deneme in 1 2 3; do
            if lftp -f /tmp/tam.lftp; then
              echo "Yükleme tamam (deneme $deneme)"; exit 0
            fi
            echo "Deneme $deneme başarısız, 30 sn sonra tekrar..."; sleep 30
          done
          echo "Üç denemede de yüklenemedi"; exit 1
