# Siteyi derleyip cPanel'deki public_html'e FTP ile yükler.
# main'e her birleştirmede ve her gece 00:05'te (anasayfadaki "bugün" yenilensin diye) çalışır.
name: Yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 21 * * *' # 00:05 İstanbul
  workflow_dispatch:

concurrency:
  group: yayinla
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: FTP ile cPanel'e yükle
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIZIN: ${{ vars.FTP_DIZIN || 'public_html' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-protect-list true;
            set net:max-retries 3;
            set net:timeout 20;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --reverse --verbose --only-newer --parallel=2 ./dist/ \"$FTP_DIZIN\";
          "
