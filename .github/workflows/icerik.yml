# Her gün 10 gün öncesi ile 10 gün sonrası arasını (ve tüm yılı doldurmak için verisi olmayan en yakın 12 günü) Vikipedi'den ve Cumhuriyet haber arşivinden çeker
# (pencere her gün bir gün kayar, eklenen günler kalır). Eksik özetleri Gemini (ücretsiz) ile yazar
# ve bir Pull Request açar. PR otomatik birleştirilir ve site yayınlanır.
name: Günlük içerik

on:
  schedule:
    - cron: '0 6 * * *' # 09:00 İstanbul
  workflow_dispatch:
    inputs:
      kapsam:
        description: 'Boş = 10 gün önce / 10 gün sonra, "--hepsi" = 366 gün, "--gun 09-27" = tek gün'
        required: false
        default: ''
      limit:
        description: 'En fazla kaç özet yazılsın'
        required: false
        default: '400'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  icerik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Vikipedi'den listeleri çek
        run: node scripts/wiki-cek.mjs ${{ github.event.inputs.kapsam || '--eksikler 12' }}

      - name: Geçmiş yılların haberlerini çek (Cumhuriyet arşivi)
        run: node scripts/haber-cek.mjs --eksikler 12

      - name: Eksik özetleri yaz
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/ozet-yaz.mjs ${{ github.event.inputs.kapsam }} --limit ${{ github.event.inputs.limit || '400' }}

      - name: Derlemeyi dene
        run: npm run build

      - name: Pull Request aç
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: icerik/gunluk
          delete-branch: true
          commit-message: 'İçerik: günlük güncelleme'
          title: 'İçerik: günlük güncelleme'
          body: |
            Otomatik içerik güncellemesi.

            - Vikipedi olayları: `durum: "yayinda"` olanlar yayına girer, `durum: "incele"` olanlar modelin emin olmadığı kayıtlardır (yayınlanmaz).
            - Haberler: `durum: "yazildi"` olanlar yayına girer, `durum: "incele"` olanlar Türkçe karakter kontrolünden geçemedi (yayınlanmaz), `durum: "elendi"` olanlar önemsiz bulundu.
            - Bir kaydı elle onaylamak için `durum` alanını uygun değere çevirin; kaldırmak için `ozet` alanını `null` yapın.
          labels: icerik

      # Derleme yukarıda geçti; PR otomatik birleştirilir ve yayın başlatılır
      # (GITHUB_TOKEN ile yapılan birleştirme push tetiklemediği için Yayınla elle çağrılır).
      - name: PR'ı birleştir ve yayınla
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --merge
          gh workflow run yayinla.yml
